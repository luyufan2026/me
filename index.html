<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WHO AM I?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="experience">

    <!-- opening -->
    <section id="opening" class="section is-active">
      <button class="question" id="opening-question" type="button" aria-label="WHO AM I?">
        <span class="question-mark"><span class="typed"></span><span class="caret" aria-hidden="true"></span></span>
        <span class="question-line"><span class="typed"></span></span>
      </button>
    </section>

    <!-- memory-section -->
    <section id="memory-section" class="section" inert>
      <div class="body-guide" id="body-guide" aria-hidden="true">
        <svg viewBox="0 0 200 340" fill="none">
          <defs>
            <linearGradient id="guide-fade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#e8e6e3" stop-opacity="0.42"/>
              <stop offset="0.62" stop-color="#e8e6e3" stop-opacity="0.28"/>
              <stop offset="1" stop-color="#e8e6e3" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="M100 28 C62 28 40 70 40 116 C40 158 60 186 84 198 C64 208 28 220 8 236" stroke="url(#guide-fade)" stroke-width="1.35" stroke-linecap="round"/>
          <path d="M100 28 C138 28 160 70 160 116 C160 158 140 186 116 198 C136 208 172 220 192 236" stroke="url(#guide-fade)" stroke-width="1.35" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="memory-stage" class="memory-stage"></div>
      <div class="memory-line" id="memory-line" aria-hidden="true">
        <p class="memory-age"></p>
        <p class="memory-text"></p>
      </div>
    </section>

    <!-- platform-section -->
    <section id="platform-section" class="section" inert>
      <div id="platform-marks"></div>
      <div id="platform-views"></div>
    </section>

    <!-- collapse-section -->
    <section id="collapse-section" class="section" inert>
      <div id="bubble-field"></div>
    </section>

    <!-- eye-section -->
    <section id="eye-section" class="section" inert>
      <div class="eye-wrap" id="eye-wrap">
        <img id="eye-photo" class="eye-photo" alt="" draggable="false" />
        <button class="pupil" id="pupil" type="button" aria-label="pupil"></button>
      </div>
    </section>

    <!-- camera-section -->
    <section id="camera-section" class="section" inert>
      <div class="world" id="world">
        <div class="world-arc" id="world-arc">
          <video class="world-pane pane-left" muted loop playsinline></video>
          <video class="world-pane pane-center" loop playsinline></video>
          <video class="world-pane pane-right" muted loop playsinline></video>
        </div>
        <figure class="person" id="person">
          <div class="person-body"></div>
          <div class="person-head">
            <span class="person-eye"></span>
          </div>
        </figure>
        <div class="finder-chrome" aria-hidden="true">
          <div class="finder-readout">
            <span class="rec"><i></i>REC</span>
            <span class="timestamp" id="timestamp">00:00:00</span>
          </div>
        </div>
      </div>
    </section>

    <!-- ending-section -->
    <section id="ending-section" class="section" inert>
      <button class="question" id="ending-question" type="button" aria-label="WHO AM I?">
        <span class="question-mark"><span class="typed"></span><span class="caret" aria-hidden="true"></span></span>
        <span class="question-line"><span class="typed"></span></span>
      </button>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
